<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaon Pani Sewa</title>
<style>
:root{--ink:#1d1d1b;--bg:#eef6fb;--card:#fff;--mute:#4a4a48;--line:#1d1d1b;--blue:#1971c2;--navy:#0b4a82}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif;padding-bottom:84px}
main{max-width:480px;margin:0 auto;padding:16px 16px 24px}
h1{margin:0 0 4px;font-size:26px;color:var(--navy)}
h2{font-size:18px;color:var(--navy);margin:18px 0 8px}
.top{display:flex;justify-content:flex-end;margin-bottom:8px}
.langbtn{min-height:40px;padding:0 14px;border:1.5px solid var(--navy);border-radius:20px;background:#fff;color:var(--navy);font-weight:600;cursor:pointer}
.sub{color:var(--mute);font-size:14px;margin-bottom:16px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
a.card{display:block;color:var(--ink);text-decoration:none;font-weight:700;background:#fff3bf;border-color:#a67c00}
#nextTanker{background:#d0ebff;border-color:var(--navy)}
.warn{background:#ffe3e3;border-color:#a61e1e;color:#5c1010;font-weight:600}
.reply{background:#e5dbff;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{border:1.5px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600;background:#e2e2de;white-space:nowrap}
.s-naya,.t-baaki,.q-warn{background:#fff3bf;color:#5c4400}
.s-sarkar_ko_bheji{background:#ffd8a8;color:#7c2d12}
.s-kaam_chalu,.t-raste_mein{background:#d0ebff;color:var(--navy)}
.s-theek_hua,.t-aa_gaya,.q-good{background:#d3f9d8;color:#1b5e20}
.q-bad{background:#ffe3e3;color:#5c1010}
.mute{color:var(--mute);font-size:13px;font-weight:400}
button,select,input,textarea{font:inherit;color:var(--ink)}
button.big,select,input,textarea{min-height:48px;border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:0 12px;width:100%}
textarea{padding:10px;height:80px}
button.big{font-weight:600;cursor:pointer;margin-bottom:10px}
button.opt:nth-of-type(1){background:#fff4e6}
button.opt:nth-of-type(2){background:#e7f5ff}
button.opt:nth-of-type(3){background:#f3f0ff}
button.dark{background:var(--blue);color:#fff;border-color:var(--navy)}
button.red{background:#fff;color:#a61e1e;border-color:#a61e1e}
button.opt.sel{background:var(--navy);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.grid>*{min-height:84px;font-weight:700;font-size:15px;border-radius:14px;border:2px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;padding:6px}
.c1{background:#ffe8cc;border-color:#c2410c;color:#7c2d12}
.c2{background:#d0ebff;border-color:var(--navy);color:var(--navy)}
.c3{background:#c5f6fa;border-color:#0b7285;color:#0b5560}
.c4{background:#d3f9d8;border-color:#2b8a3e;color:#1b5e20}
.c5{background:#fff3bf;border-color:#a67c00;color:#5c4400}
.c6{background:#ffdeeb;border-color:#a61e4d;color:#7a1337}
.c7{background:#e5dbff;border-color:#5f3dc4;color:#3b2a8c}
.c8{background:#e9ecef;border-color:#495057;color:#212529}
.btnlink{display:block;text-align:center;padding:12px;border:1.5px solid var(--navy);border-radius:10px;font-weight:600;text-decoration:none;color:var(--navy);background:#fff;margin-top:8px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 4px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1.5px solid var(--line);display:flex}
nav button{flex:1;min-height:60px;border:0;background:none;font-size:12px;cursor:pointer;padding:0 2px}
nav button.on{font-weight:700;background:#d0ebff;color:var(--navy)}
img.ph{max-width:100%;border-radius:8px;margin-top:8px}
.msg{padding:10px;border-radius:10px;margin-bottom:10px;border:1.5px solid #a61e1e;background:#ffe3e3;color:#5c1010}
.bars{display:flex;gap:6px;height:96px;margin-top:10px}
.bcol{flex:1;display:flex;flex-direction:column;height:100%;text-align:center}
.barwrap{flex:1;display:flex;align-items:flex-end}
.bar{width:100%;border-radius:4px 4px 0 0;min-height:4px}
.l-low{background:#e03131}.l-mid{background:#f59f00}.l-high{background:#2f9e44}
.meter{height:12px;background:#e2e2de;border-radius:6px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:#e8590c}
.big-num{font-size:28px;font-weight:700;color:var(--navy)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stats .card{margin:0}
ul.tips{padding-left:18px;margin:0}ul.tips li{margin-bottom:10px;line-height:1.5}
@media print{nav,.top,.noprint{display:none!important}body{background:#fff}}
</style>
</head>

<div class="top noprint"><button class="langbtn" id="langBtn"></button></div>

<section id="home" class="on">

  <div class="card" id="nextTanker"></div>
  <div class="grid">
    <button class="c1" data-go="shikayat" data-i="h_complain"></button>

    <button class="c3" data-go="paani" data-i="h_water"></button>
    <button class="c4" data-go="status" data-i="h_mine"></button>
    <button class="c5" data-go="report" data-i="h_report"></button>
    <button class="c6" data-go="tips" data-i="h_tips"></button>
    <a class="c7" id="callBtn" hidden data-i="h_call"></a>
    <button class="c8" id="adminBtn"></button>
  </div>
  <div class="mute" id="adminState" style="margin-bottom:12px"></div>
  <a class="card" href="https://pgportal.gov.in" target="_blank" rel="noopener"><span data-i="portal"></span><div class="mute" data-i="portalSub"></div></a>
</section>

<section id="shikayat">
  <h1 data-i="f_title"></h1><div class="sub" data-i="f_sub"></div>
  <div id="fmsg"></div>
  <button class="big opt" data-type="handpump" data-i="ty_handpump"></button>
  <button class="big opt" data-type="no_water" data-i="ty_no_water"></button>
  <button class="big opt" data-type="dirty_water" data-i="ty_dirty_water"></button>
  <label for="mohalla" data-i="f_mohalla"></label>

</section>

<section id="tanker"><h1 data-i="tk_title"></h1><div class="sub" data-i="tk_sub"></div><div id="tlist"></div></section>

<section id="paani"><h1 data-i="w_title"></h1><div class="sub" data-i="w_sub"></div><div id="wbox"></div></section>

<section id="status"><h1 data-i="st_title"></h1><div class="sub" id="ssub"></div><div id="clist"></div></section>

<section id="report"><h1 data-i="r_title"></h1><div class="sub" data-i="r_sub"></div><div id="rbox"></div></section>

<section id="tips"><h1 data-i="tp_title"></h1><div class="sub" data-i="tp_sub"></div><div id="tipbox"></div></section>
</main>

<nav class="noprint">
  <button data-go="home" data-nav="home" class="on" data-i="n_home"></button>
  <button data-go="shikayat" data-nav="shikayat" data-i="n_complain"></button>
  <button data-go="tanker" data-nav="tanker" data-i="n_tanker"></button>
  <button data-go="paani" data-nav="paani" data-i="n_water"></button>
  <button data-go="status" data-nav="status" data-i="n_status"></button>
</nav>

const R={home:loadTankers,tanker:loadTankers,shikayat:loadTankers,paani:loadWater,status:loadComplaints,report:loadReport,tips:renderTips};
function go(name){
  cur=name;
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===name));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.nav===name));
  window.scrollTo(0,0);
  Promise.resolve(R[name]&&R[name]()).catch(fail);
}
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
$("#langBtn").onclick=()=>{lang=lang==="hi"?"rm":"hi";localStorage.setItem("lang",lang);applyLang();go(cur)};

/* ===== tanker aur mohalla ===== */
async function loadTankers(){
  tankers=await api("/api/tankers");
  const m=$("#mohalla"),keep=m.value;
  m.textContent="";
  m.append(el("option",{value:"",textContent:t("f_pick")}));
  tankers.forEach(x=>m.append(el("option",{value:x.mohalla,textContent:x.mohalla})));
  if(tankers.some(x=>x.mohalla===keep))m.value=keep;
  const next=tankers.find(x=>x.status==="raste_mein")||tankers.find(x=>x.status==="baaki");
  const box=$("#nextTanker");box.textContent="";
  box.append(el("div",{className:"mute",textContent:t("next")}),
    el("strong",{textContent:next?`${next.mohalla} · ${next.time||t("later")}`:t("alldone")}));
  const list=$("#tlist");list.textContent="";
  tankers.forEach(x=>{
    const card=el("div",{className:"card"});
    if(admin){
      const name=el("input",{value:x.mohalla,maxLength:50,placeholder:t("tk_name")});
      const time=el("input",{value:x.time,placeholder:t("tk_time"),maxLength:30,style:"margin-top:8px"});
      const st=sel(tsMap(),x.status);st.style.marginTop="8px";
      const save=el("button",{className:"big dark",textContent:t("save"),style:"margin-top:8px",onclick:async()=>{
        try{await api("/api/tankers/"+x.id,{method:"PUT",headers:JH,body:JSON.stringify({name:name.value,time:time.value,status:st.value})});
          save.textContent=t("saved");loadTankers()}catch(e){fail(e)}}});
      const rm=el("button",{className:"big red",textContent:t("del"),onclick:async()=>{
        if(!confirm(t("tk_confirm")))return;
        try{await api("/api/tankers/"+x.id,{method:"DELETE"});loadTankers()}catch(e){fail(e)}}});
      card.append(name,time,st,save,rm);
    }else{
      card.append(el("div",{className:"row"},
        el("div",{},el("strong",{textContent:x.mohalla}),el("div",{className:"mute",textContent:x.time||t("later")})),
        el("span",{className:"tag t-"+x.status,textContent:tsMap()[x.status]})));
    }
    list.append(card);
  });
  if(admin){
    const nm=el("input",{placeholder:t("tk_add"),maxLength:50});
    const ad=el("button",{className:"big dark",textContent:t("add"),style:"margin-top:8px",onclick:async()=>{
      try{await api("/api/tankers",{method:"POST",headers:JH,body:JSON.stringify({name:nm.value})});loadTankers()}catch(e){fail(e)}}});
    list.append(el("div",{className:"card"},nm,ad));
  }
}

/* ===== shikayat bhejna ===== */
function shrink(file,max=1000){return new Promise((ok,no)=>{
  const img=new Image();
  img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",0.8))};
  img.onerror=()=>no(new Error("photo"));
  img.src=URL.createObjectURL(file);})}
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  selType=b.dataset.type;
  document.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===b));
});
$("#send").onclick=async()=>{
  const box=$("#fmsg"),btn=$("#send");box.textContent="";
  btn.disabled=true;btn.textContent=t("f_sending");
  try{
    const body={type:selType,mohalla:$("#mohalla").value,note:$("#note").value};
    const f=$("#photo").files[0];
    if(f)body.photo=await shrink(f);
    const d=await api("/api/complaints",{method:"POST",headers:JH,body:JSON.stringify(body)});
    localStorage.setItem("mine2",JSON.stringify([d.token,...mine()]));
    $("#note").value="";$("#photo").value="";selType="";
    document.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));
    go("status");
  }catch(e){box.append(el("div",{className:"msg",textContent:e.message==="photo"?t("e_photo"):errText(e.message)}))}
  btn.disabled=false;btn.textContent=t("f_send");
};

/* ===== awaaz se likhna ===== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
  const vb=$("#voice");vb.hidden=false;
  vb.onclick=()=>{
    const r=new SR();r.lang="hi-IN";r.interimResults=false;
    r.onresult=e=>{const n=$("#note");n.value=(n.value+" "+e.results[0][0].transcript).trim().slice(0,500)};
    r.onend=r.onerror=()=>{vb.textContent=t("f_voice")};
    vb.textContent=t("f_listen");
    try{r.start()}catch{vb.textContent=t("f_voice")}
  };
}

/* ===== shikayatein ===== */
function govMsg(c){
  return "पानी की शिकायत\nगाँव: "+(cfg.gaon||"")+"\nसमस्या: "+hindi("ty_"+c.type)+"\nमोहल्ला: "+c.mohalla+"\nतारीख: "+c.created_at.slice(0,10)+"\n"
    +(c.note?"विवरण: "+c.note+"\n":"")+(c.photo?"फोटो: "+location.origin+"/uploads/"+c.photo+"\n":"")+"कृपया जल्द कार्यवाही करें।";
}
async function loadComplaints(){
  const list=$("#clist");list.textContent="";
  $("#ssub").textContent=admin?t("st_subA"):t("st_sub");
  const tk=mine();
  if(!admin&&!tk.length){list.append(el("div",{className:"mute",textContent:t("st_none")}));return}
  const data=await api(admin?"/api/complaints":"/api/complaints?tokens="+tk.join(","));
  if(!data.length){list.append(el("div",{className:"mute",textContent:t("st_none")}));return}
  data.forEach(c=>{
    const card=el("div",{className:"card"});
    card.append(el("div",{className:"row"},el("strong",{textContent:t("ty_"+c.type)}),
      admin?"":el("span",{className:"tag s-"+c.status,textContent:stMap()[c.status]})),
      el("div",{className:"mute",textContent:`${c.mohalla} · ${c.created_at.slice(0,10)}`}));
    if(c.note)card.append(el("div",{textContent:c.note}));
    if(c.photo)card.append(el("img",{className:"ph",src:"/uploads/"+c.photo,alt:""}));
    if(!admin&&c.reply)card.append(el("div",{className:"reply"},el("strong",{textContent:t("st_reply")+": "}),c.reply));
    if(admin){
      if(c.similar>1)card.append(el("div",{className:"tag",style:"display:inline-block;margin-top:8px;background:#ffd8a8",textContent:t("st_similar",{n:c.similar})}));
      const st=sel(stMap(),c.status);st.style.marginTop="8px";
      st.onchange=async()=>{try{await api("/api/complaints/"+c.id,{method:"PATCH",headers:JH,body:JSON.stringify({status:st.value})})}catch(e){fail(e)}};
      const rep=el("textarea",{value:c.reply||"",placeholder:t("st_replyPh"),maxLength:300,style:"margin-top:8px"});
      const rb=el("button",{className:"big dark",textContent:t("st_replySave"),onclick:async()=>{
        try{await api("/api/complaints/"+c.id,{method:"PATCH",headers:JH,body:JSON.stringify({reply:rep.value})});rb.textContent=t("saved")}catch(e){fail(e)}}});
      const msg=govMsg(c);
      const mark=()=>{if(st.value==="naya"){st.value="sarkar_ko_bheji";st.onchange()}};
      const wa=el("a",{className:"btnlink",textContent:t("st_wa"),target:"_blank",rel:"noopener",href:"https://wa.me/?text="+encodeURIComponent(msg),onclick:mark});
      const ml=el("a",{className:"btnlink",textContent:t("st_mail"),href:"mailto:?subject="+encodeURIComponent("पानी की शिकायत: "+hindi("ty_"+c.type)+" - "+c.mohalla)+"&body="+encodeURIComponent(msg),onclick:mark});
      card.append(st,rep,rb,wa,ml);
    }
    list.append(card);
  });
}

/* ===== pani level aur quality ===== */
const lvlCls=v=>v<25?"l-low":v<50?"l-mid":"l-high";
function groupBy(rows,kind){
  const g={};
  rows.filter(r=>r.kind===kind).reverse().forEach(r=>{(g[r.source]=g[r.source]||[]).push(r)});
  return g;
}
async function loadWater(){
  const rows=await api("/api/readings");
  const box=$("#wbox");box.textContent="";
  const lv=groupBy(rows,"level"),td=groupBy(rows,"tds");
  const undo=(r)=>admin?el("button",{className:"big red",textContent:t("w_undo"),style:"margin:8px 0 0",onclick:async()=>{
    try{await api("/api/readings/"+r.id,{method:"DELETE"});loadWater()}catch(e){fail(e)}}}):"";

  box.append(el("h2",{textContent:t("w_level")}));
  if(!Object.keys(lv).length)box.append(el("div",{className:"mute",textContent:t("w_none")}));
  for(const s in lv){
    const list=lv[s],last=list[list.length-1];
    const card=el("div",{className:"card"+(last.value<25?" warn":"")});
    card.append(el("div",{className:"row"},el("strong",{textContent:s}),el("span",{className:"big-num",textContent:last.value+"%"})),
      el("div",{className:"mute",textContent:last.created_at.slice(0,10)}));
    if(last.value<25)card.append(el("div",{textContent:t("w_low",{s:s,v:last.value}),style:"margin-top:6px"}));
    const bars=el("div",{className:"bars"});
    list.slice(-7).forEach(r=>bars.append(el("div",{className:"bcol"},
      el("div",{className:"barwrap"},el("div",{className:"bar "+lvlCls(r.value),style:"height:"+Math.max(r.value,4)+"%"})),
      el("div",{className:"mute",textContent:r.value}))));
    card.append(bars,undo(last));
    box.append(card);
  }

  box.append(el("h2",{textContent:t("w_tds")}));
  if(!Object.keys(td).length)box.append(el("div",{className:"mute",textContent:t("w_none")}));
  for(const s in td){
    const last=td[s][td[s].length-1];
    const q=last.value<=500?["good","w_good"]:last.value<=1000?["warn","w_warn"]:["bad","w_bad"];
    box.append(el("div",{className:"card"},
      el("div",{className:"row"},el("strong",{textContent:s}),el("span",{className:"tag q-"+q[0],textContent:t(q[1])})),
      el("div",{className:"mute",textContent:t("w_last",{v:last.value+" ppm",d:last.created_at.slice(0,10)})}),undo(last)));
  }
  box.append(el("div",{className:"mute",textContent:t("w_tdsNote"),style:"margin:8px 0"}));

  if(admin){
    const kind=sel({level:t("k_level"),tds:t("k_tds")},"level");
    const src=el("input",{placeholder:t("w_source"),maxLength:40,style:"margin-top:8px"});
    const val=el("input",{type:"number",inputMode:"numeric",min:0,placeholder:t("w_value"),style:"margin-top:8px"});
    const sv=el("button",{className:"big dark",textContent:t("save"),style:"margin-top:8px",onclick:async()=>{
      try{await api("/api/readings",{method:"POST",headers:JH,body:JSON.stringify({kind:kind.value,source:src.value,value:Number(val.value)})});loadWater()}catch(e){fail(e)}}});
    box.append(el("h2",{textContent:t("w_add")}),el("div",{className:"card"},kind,src,val,sv));
  }
}

/* ===== report ===== */
async function loadReport(){
  const r=await api("/api/report");
  const box=$("#rbox");box.textContent="";
  const pending=r.total-r.done;
  const stat=(label,val)=>el("div",{className:"card"},el("div",{className:"mute",textContent:label}),el("div",{className:"big-num",textContent:String(val)}));
  box.append(el("div",{className:"stats"},
    stat(t("r_total"),r.total),stat(t("r_month"),r.month),stat(t("r_pending"),pending),stat(t("r_done"),r.done),
    stat(t("r_avg"),r.avgDays===null?"—":r.avgDays),stat(t("r_old"),r.old)));
  box.append(el("h2",{textContent:t("r_by")}));
  const top=Math.max(1,...r.byMohalla.map(x=>x.total));
  r.byMohalla.forEach(x=>box.append(el("div",{className:"card"},
    el("div",{className:"row"},el("strong",{textContent:x.mohalla}),el("span",{textContent:`${x.pending} / ${x.total}`})),
    (()=>{const m=el("div",{className:"meter"}),i=el("i");i.style.width=(100*x.pending/top)+"%";m.append(i);return m})())));
  box.append(el("h2",{textContent:t("r_types")}));
  r.byType.forEach(x=>box.append(el("div",{className:"card row"},el("span",{textContent:t("ty_"+x.type)}),el("strong",{textContent:String(x.c)}))));
  const text="पानी शिकायत रिपोर्ट"+(cfg.gaon?" - "+cfg.gaon:"")+"\nकुल: "+r.total+"\nइस महीने: "+r.month+"\nबाकी: "+pending+"\nठीक हुई: "+r.done
    +"\n7 दिन से पुरानी बाकी: "+r.old+"\n"+r.byMohalla.map(x=>x.mohalla+": "+x.pending+" बाकी / "+x.total).join("\n");
  box.append(el("a",{className:"btnlink noprint",textContent:t("r_share"),target:"_blank",rel:"noopener",href:"https://wa.me/?text="+encodeURIComponent(text)}),
    el("button",{className:"big noprint",textContent:t("r_print"),style:"margin-top:8px",onclick:()=>window.print()}));
}
